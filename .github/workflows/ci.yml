name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name api-container events-api:latest
          sleep 5

      - name: Health Check
        run: curl --fail http://localhost:5000/api/health || exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run tests
        run: pytest -v

      - name: Cleanup Container
        if: always()
        run: docker rm -f api-container || true

  # --- NEUER DEPLOY JOB ---
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Läuft nur, wenn die Tests erfolgreich waren
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Nur bei Push auf Main deployen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/events-api:latest

      - name: Trigger Render Deployment
        run: curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Automated Smoke Test
        run: |
          echo "Warte auf Render Deployment (30s)..."
          sleep 30
          # Prüft, ob die Live-API auf Render antwortet
          curl --fail ${{ secrets.RENDER_BASE_URL }}/api/health || exit 1